name: cfnext-probe

on:
  # 国内 FunctionGraph 负责定时探活；此工作流保留为手动境外兜底，避免覆盖国内实测结果
  workflow_dispatch:

concurrency:
  group: cfnext-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe Cloudflare IPs
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          RUN_KEY: ${{ secrets.RUN_KEY }}
        run: node scripts/probe.mjs
