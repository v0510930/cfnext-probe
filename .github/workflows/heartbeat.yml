name: heartbeat

# GitHub 会停用「连续 60 天无提交」仓库的定时工作流，
# 每月提交一次时间戳，保持仓库活跃状态。

on:
  schedule:
    - cron: '20 4 1 * *' # 每月 1 日 04:20 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartbeat

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Commit heartbeat
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .heartbeat
          git commit -m "chore: heartbeat $(date -u +%Y-%m)"
          git push
